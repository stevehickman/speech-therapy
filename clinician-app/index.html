<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Familiar — Clinician</title>
    <meta name="theme-color" content="#534AB7" />
    <!-- CSP notes:
         'wasm-unsafe-eval' in script-src permits WebAssembly compilation (required by libsodium).
           It does NOT enable eval() or inline scripts — only WASM module instantiation.
         React uses element.style[prop]=value (JS property assignment, not HTML style attributes)
           so 'unsafe-inline' in style-src is not needed.
         No CDN allowances — libsodium-wrappers is bundled via Vite/npm. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https:">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
